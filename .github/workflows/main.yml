name: DOZATECH Web CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: npm

    - name: Install Node dependencies
      run: npm ci --ignore-scripts

    - name: Build and verify routes
      run: |
        npm test

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: dozatech-build
        path: dist/
